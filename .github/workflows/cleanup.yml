name: Cleanup PR build
on:
  pull_request:
    types: [closed]
jobs:
  delete-prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release delete "pr-${{ github.event.pull_request.number }}" --yes --cleanup-tag || true
