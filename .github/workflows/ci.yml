name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Lint
        run: swift format lint --strict --recursive Packages App Widgets Shared AppTests
      - name: Test SyncCore
        run: swift test --package-path Packages/SyncCore
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project TelegramPhotos.xcodeproj -scheme TelegramPhotos \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TelegramPhotos.app Payload/
          test -d Payload/TelegramPhotos.app/PlugIns/TelegramPhotosWidgets.appex
          zip -qry TelegramPhotos.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramPhotos-ipa
          path: TelegramPhotos.ipa
          retention-days: 14
          if-no-files-found: error
  ios-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Test on simulator
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | head -1)
          echo "Using simulator: $SIM"
          xcodebuild test -project TelegramPhotos.xcodeproj -scheme TelegramPhotos \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGN_IDENTITY=-
  publish:
    needs: [core-tests, ios-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TelegramPhotos-ipa
      - name: Publish PR pre-release
        if: github.event_name == 'pull_request'
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" TelegramPhotos.ipa --prerelease \
            --target "${{ github.event.pull_request.head.sha }}" \
            --title "PR #${{ github.event.pull_request.number }} test build" \
            --notes "Unsigned test build of ${{ github.event.pull_request.head.sha }}. Install with SideStore."
      - name: Publish latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TelegramPhotos.ipa --latest \
            --target "${{ github.sha }}" \
            --title "Latest build" \
            --notes "Unsigned build of ${{ github.sha }} (main). Install with SideStore."
